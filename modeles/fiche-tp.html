<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- Modèle de fiche : remplacer les {{...}}, dupliquer les lignes et les blocs .formules au besoin. -->
<title>Fiche {{TPx}} – {{Nom du TP}}</title>
<style>
  :root { --encre: #1a1a1a; --gris: #6b6b6b; --trait: #d0d0d0; --fond-titre: #f3f3f3; --rouge: #d40000; }
  * { box-sizing: border-box; }
  body { margin: 0; background: #fff; color: var(--encre); font: 15px/1.45 "Segoe UI", Arial, sans-serif; }
  main { max-width: 820px; margin: 0 auto; padding: 24px 16px 48px; }
  h1 { font-size: 24px; margin: 0 0 2px; }
  .sous-titre { color: var(--gris); margin: 0 0 24px; }
  h2 { font-size: 17px; margin: 28px 0 10px; padding: 6px 10px; background: var(--fond-titre); border-left: 4px solid var(--encre); }
  h3 { font-size: 15px; margin: 18px 0 6px; color: var(--gris); }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 6px 10px; border-bottom: 1px solid var(--trait); vertical-align: top; }
  th { font-size: 13px; color: var(--gris); font-weight: 600; }
  td.symbole { font-family: Cambria, "Times New Roman", serif; font-size: 17px; font-style: italic; white-space: nowrap; width: 90px; }
  td.unite { white-space: nowrap; width: 110px; color: var(--gris); }
  ul.formules { list-style: none; margin: 0; padding: 0; }
  ul.formules li { font-family: Cambria, "Times New Roman", serif; font-size: 18px; padding: 7px 10px; border-bottom: 1px solid var(--trait); }
  .encadre { display: inline-block; border: 2px solid var(--rouge); padding: 2px 8px; font-weight: 600; }
  @media print {
    body { font-size: 12px; }
    main { max-width: none; padding: 0; }
    h2 { break-after: avoid; }
    tr, li { break-inside: avoid; }
  }
  @page { size: A4; margin: 14mm; }
</style>
</head>
<body>
<main>
  <h1>Fiche {{TPx}} – {{Nom du TP}}</h1>
  <p class="sous-titre">TD associé : {{nom du TD}}</p>

  <h2>Symboles</h2>
  <table>
    <thead><tr><th>Symbole</th><th>Nom</th><th>Unité</th></tr></thead>
    <tbody>
      <tr><td class="symbole">p</td><td>nombre de paires de pôles</td><td class="unite">—</td></tr>
      <tr><td class="symbole">P<sub>u</sub></td><td>puissance utile</td><td class="unite">W</td></tr>
    </tbody>
  </table>

  <h2>Formules (forme de base)</h2>
  <h3>{{Thème 1}}</h3>
  <ul class="formules">
    <li>P = U · I</li>
    <li>f = N<sub>p</sub> · N</li>
  </ul>
</main>
</body>
</html>
